<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10201A">
<title>Golf Yardage</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed satellite map, hole bar on top, yardage card on the bottom, tool rail on the right.
   Single light theme on purpose: dark ink on pale panels reads best in direct sunlight. */
:root{
  --ink:#10201A; --paper:#F6F8F4; --panel:rgba(246,248,244,.96); --line:#D3DCD2; --muted:#56675C;
  --flag:#D9412E; --gps:#2B7BFF; --sand:#E9C77A; --water:#5AB6FF; --good:#1F8A4C; --warn:#C27A0E;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gps);outline-offset:2px}
[hidden]{display:none!important}
#map{position:fixed;inset:0;background:#24332b}

/* top hole bar */
#top{position:fixed;top:calc(var(--sat) + 10px);left:max(12px,var(--sal));right:max(12px,var(--sar));z-index:500;display:flex;gap:8px;align-items:stretch}
.hbar{flex:1;min-width:0;display:flex;align-items:center;background:var(--panel);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hbar button.arrow{width:46px;align-self:stretch;font-size:26px;font-family:var(--display);color:var(--muted)}
.hmid{flex:1;min-width:0;text-align:center;padding:6px 0}
.hnum{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.02em}
.hmeta{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:52px;background:var(--panel);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
#courseBtn{width:50px;flex-direction:column;gap:0;padding:4px 0 2px;align-content:center}
#courseBtn span{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1}
#courseBtn svg{width:16px;height:16px;margin-top:-1px}
.crs{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px;border-radius:14px;background:#E9EEE7;margin-bottom:8px}
.crs b{font-family:var(--display);font-size:21px;font-weight:700;display:block;line-height:1.1}
.crs small{color:var(--muted);font-size:12.5px;font-weight:500}
.crs.on{background:var(--ink);color:var(--paper)}
.crs.on small{color:#B9C7BD}
.crs .pill{white-space:nowrap}
#chips{position:fixed;top:calc(var(--sat) + 74px);left:max(12px,var(--sal));z-index:500;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.2);display:flex;gap:6px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok .dot{background:var(--good)} .chip.meh .dot{background:var(--warn)}
.chip.action{background:var(--ink);color:var(--paper)}

/* right tool rail */
#rail{position:fixed;right:max(12px,var(--sar));top:calc(var(--sat) + 74px);z-index:500;display:flex;flex-direction:column;gap:8px}
.tool{width:52px;height:52px;border-radius:14px;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;position:relative}
.tool svg{width:22px;height:22px}
.tool.on{background:var(--ink);color:var(--paper)}
.tool small{position:absolute;bottom:3px;left:0;right:0;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center}

/* banner for draw/edit modes */
#banner{position:fixed;left:max(12px,var(--sal));right:max(12px,var(--sar));bottom:calc(var(--sab) + 130px);z-index:600;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.35)}
#banner .msg{flex:1 1 160px;min-width:0;font-size:14px;line-height:1.3}
#banner button{background:rgba(255,255,255,.14);padding:8px 12px;border-radius:10px;font-weight:600}
#banner button.primary{background:var(--paper);color:var(--ink)}

/* bottom yardage card */
#card{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.28);padding:8px max(14px,var(--sar)) calc(var(--sab) + 8px) max(14px,var(--sal))}
#haz:empty{display:none}
.yards{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:end;text-align:center;font-variant-numeric:tabular-nums}
.yards .lab{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.yards .v{font-family:var(--display);font-weight:600;font-size:24px;line-height:1}
.yards .c .v{font-size:44px;font-weight:700;color:var(--ink)}
.yards .c .lab{color:var(--flag)}
.unit{font-size:.4em;font-weight:600;color:var(--muted);margin-left:2px}
#src{font-size:11.5px;color:var(--muted);text-align:center;margin-top:1px;min-height:0;line-height:1.25}
#haz{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px;scrollbar-width:none}
#haz::-webkit-scrollbar{display:none}
.hz{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hz b{font-weight:700}
.hz i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
.cardrow{display:flex;gap:6px;margin-top:6px}
.cardrow button{flex:1;padding:7px 8px;border-radius:10px;background:#E7ECE5;font-weight:700;font-size:14px}
.cardrow button.score{background:var(--ink);color:var(--paper);flex:1.4}
.empty{font-size:13.5px;color:var(--muted);text-align:center;padding:4px 0 2px;line-height:1.4}

/* sheets */
#scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:900}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--paper);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding:8px max(16px,var(--sar)) calc(var(--sab) + 18px) max(16px,var(--sal));box-shadow:0 -4px 20px rgba(0,0,0,.3)}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
#sheet h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 12px;text-wrap:balance}
#sheet h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:12px;background:#E3E9E1;font-size:24px;font-weight:600}
.stepper .n{font-family:var(--display);font-size:38px;font-weight:700;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px}
.seg button{padding:10px 14px;border-radius:10px;background:#E3E9E1;font-weight:600}
.seg button.on{background:var(--ink);color:var(--paper)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns button{flex:1 1 120px;padding:13px 10px;border-radius:12px;background:#E3E9E1;font-weight:700}
.btns button.primary{background:var(--ink);color:var(--paper)}
.btns button.danger{background:#F6DEDA;color:#8E2416}
.list button.item{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);font-weight:600}
.list button.item span{color:var(--muted);font-weight:500;font-size:13px}
.note{font-size:13px;color:var(--muted);line-height:1.45;max-width:62ch}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#E3E9E1}
.pill.good{background:#D6EEDD;color:var(--good)}

/* scorecard table */
.sc-wrap{overflow-x:auto;margin:0 -4px}
table.sc{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
table.sc th,table.sc td{text-align:center;padding:6px 2px;min-width:30px}
table.sc th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
table.sc tr.par td{color:var(--muted)}
table.sc td.tot{font-weight:700;background:#E9EEE7}
table.sc td button{width:30px;height:30px;display:inline-grid;place-items:center;font-weight:700}
.s-eagle{border-radius:50%;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--paper),0 0 0 6px var(--ink)}
.s-birdie{border-radius:50%;box-shadow:0 0 0 2px var(--ink)}
.s-bogey{box-shadow:0 0 0 2px var(--ink)}
.s-double{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--paper),0 0 0 6px var(--ink)}
.cur-h{background:#FFF0B8;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#E9EEE7;border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}

/* map overlays */
.dlabel{background:var(--ink);color:#fff;font-family:var(--display);font-weight:700;font-size:17px;padding:2px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%);display:inline-block;font-variant-numeric:tabular-nums}
.dlabel.small{font-size:14px;background:rgba(16,32,26,.85)}
.leaflet-div-icon{background:none;border:0}
.tgt{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink);position:relative}
.tgt::after{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}
.flag{width:4px;height:34px;background:#fff;margin:-34px 0 0 -2px;position:relative;box-shadow:0 0 2px rgba(0,0,0,.6)}
.flag::after{content:"";position:absolute;left:4px;top:0;border-left:18px solid var(--flag);border-top:7px solid transparent;border-bottom:7px solid transparent}
.teem{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.notem{min-width:24px;height:24px;margin:-24px 0 0 -12px;border-radius:12px 12px 12px 2px;background:#FFD54A;color:var(--ink);font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.markm{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:3px;background:#fff;border:3px solid var(--flag);transform:rotate(45deg)}
.leaflet-popup-content{font-family:var(--body);font-size:14px;margin:10px 12px}
.leaflet-popup-content button{margin-top:8px;padding:6px 10px;border-radius:8px;background:#F6DEDA;color:#8E2416;font-weight:700}
.leaflet-control-attribution{font-size:9px!important;margin-bottom:calc(var(--sab) + 120px)!important}

.layout{position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.layout img{display:block;width:100%;height:auto}
.layout .ring{position:absolute;width:13%;aspect-ratio:1;max-width:100%;border:3px solid var(--flag);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(255,255,255,.85);pointer-events:none}
.holehit{cursor:pointer}
.hlab{cursor:pointer;display:inline-block;transform:translate(-50%,-50%);background:rgba(16,32,26,.8);color:#fff;font-weight:700;font-size:12px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
.inset{float:right;position:relative;width:110px;margin:0 0 4px 10px;border-radius:8px;overflow:hidden;background:#fff}
.inset img{display:block;width:100%}
.inset i{position:absolute;width:20px;height:20px;border:2px solid var(--flag);border-radius:50%;transform:translate(-50%,-50%)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 74px);z-index:1000;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="map" aria-label="Course map"></div>

<div id="top">
  <button class="iconbtn" id="courseBtn" aria-label="Choose course"><span id="courseCode">GRG</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg></button>
  <div class="hbar">
    <button class="arrow" id="prevH" aria-label="Previous hole">‹</button>
    <div class="hmid"><div class="hnum">Hole <span id="hNum">1</span></div><div class="hmeta" id="hMeta"></div></div>
    <button class="arrow" id="nextH" aria-label="Next hole">›</button>
  </div>
  <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>

<div id="chips"><div class="chip" id="gpsChip"><span class="dot"></span><span id="gpsTxt">Waiting for GPS</span></div></div>

<div id="rail">
  <button class="tool on" data-mode="measure" aria-label="Measure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><small>Aim</small></button>
  <button class="tool" data-mode="note" aria-label="Add note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 4h14v12H10l-5 4z"/></svg><small>Note</small></button>
  <button class="tool" data-mode="draw" aria-label="Draw line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5-7 4 4 7-10"/></svg><small>Draw</small></button>
  <button class="tool" id="markBtn" aria-label="Mark ball position"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke-linecap="round"/></svg><small>Shot</small></button>
  <button class="tool" id="fitBtn" aria-label="Show me and the green"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 8 7 2-7 2-3 8-3-8-7-2 7-2z"/></svg><small>Fit</small></button>
</div>

<div id="banner" hidden><div class="msg" id="bannerMsg"></div><div id="bannerBtns" style="display:flex;gap:8px"></div></div>

<div id="card">
  <div class="yards">
    <div><div class="v" id="dF">—</div><div class="lab">Front</div></div>
    <div class="c"><div class="v" id="dC">—</div><div class="lab">Centre</div></div>
    <div><div class="v" id="dB">—</div><div class="lab">Back</div></div>
  </div>
  <div id="src"></div>
  <div id="haz"></div>
  <div class="cardrow">
    <button id="layoutBtn">Layout</button>
    <button id="cardBtn">Card</button>
    <button class="score" id="scoreBtn">Score</button>
  </div>
</div>

<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"></div>
<div id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

async function overpass(q){
  let last;
  for(const ep of OVERPASS){

  }

}

    S.course = Object.assign(parsed, {fetchedAt: Date.now(), osmName: (pick.tags&&pick.tags.name)||""});
    save(); drawFeatures(); render(true);
    const n = Object.keys(parsed.holes).length;

  const polysOf = el => {
    if(el.type==="way" && el.geometry) return [el.geometry.map(p=>[p.lat,p.lon])];
    if(el.type==="relation" && el.members) return el.members.filter(m=>m.role!=="inner" && m.geometry).map(m=>m.geometry.map(p=>[p.lat,p.lon]));
    return [];
  };
  els.forEach(el => {
    const t = el.tags || {}, g = t.golf;
    if(g==="hole" && el.type==="way" && el.geometry){
      const n = parseInt(t.ref,10); if(!(n>=1 && n<=18)) return;
      const line = el.geometry.map(p=>[p.lat,p.lon]);
      holes[n] = {line, tee: line[0], end: line[line.length-1], par: parseInt(t.par,10)||undefined};
      return;
    }
    let type = null;
    if(g==="green") type="green"; else if(g==="bunker") type="bunker"; else if(g==="tee") type="tee";
    else if(g==="water_hazard" || g==="lateral_water_hazard" || t.natural==="water") type="water";
    if(!type) return;
    polysOf(el).forEach(pts => { if(pts.length>2){ const f={t:type, pts}; features.push(f); if(type==="green") greens.push(f); } });
  });
  // green centre, front and back for each hole: the green polygon at the end of the hole line,
  // measured along the line of approach (second-last point of the hole line -> green)
  Object.values(holes).forEach(H => {
    let best=null, bestD=60;
    greens.forEach(g => { const d = inPoly(H.end, g.pts) ? 0 : dist(H.end, centroid(g.pts)); if(d < bestD){ bestD=d; best=g; } });
    const prev = H.line.length>1 ? H.line[H.line.length-2] : H.tee;
    if(best){
      const c = centroid(best.pts), toXY = local(c), back = unlocal(c);
      const v = toXY(prev); const len = Math.hypot(v[0],v[1]) || 1; const dir = [-v[0]/len, -v[1]/len]; // pointing from approach toward the green
      let mn=Infinity, mx=-Infinity; best.pts.forEach(p => { const q=toXY(p), t=q[0]*dir[0]+q[1]*dir[1]; mn=Math.min(mn,t); mx=Math.max(mx,t); });
      H.gC = c; H.gF = back([dir[0]*mn, dir[1]*mn]); H.gB = back([dir[0]*mx, dir[1]*mx]);
    } else { H.gC = H.end; }
    delete H.end;
  });
  return {holes, features};
}

/* ---------- rendering ---------- */
function me(){ return gps || hole(cur).tee || null; }

function render(fit){
  const H = hole(cur);
  $("#hNum").textContent = cur;
  $("#hMeta").textContent = `Par ${H.par} · Index ${H.si} · ${fmt(H.len)}${u()}`;
  holeLayer.clearLayers();
  // every hole's routing line, like the club map; the current hole is drawn strongest
  for(let h=1; h<=18; h++){
    if(h===cur) continue; const O = hole(h); if(!(O.tee && O.gC)) continue;
    const ln = (O.line && O.line.length>1) ? O.line : [O.tee, O.gC];
    L.polyline(ln, {color:"#fff", weight:1.5, opacity:.4, interactive:false}).addTo(holeLayer);
    // tap another hole's line or number to jump to it (measure mode only, so drawing and editing aren't hijacked)
    const pick = e => { if(e && e.originalEvent) L.DomEvent.stopPropagation(e); if(walk || editing || mode!=="measure") return; cur = h; target = null; render(true); };
    L.polyline(ln, {color:"#fff", weight:20, opacity:0, interactive:true, bubblingMouseEvents:false, className:"holehit"}).on("click", pick).addTo(holeLayer);
    L.marker(O.tee, {icon:L.divIcon({className:"", html:`<span class="hlab">${h}</span>`, iconSize:null}), interactive:true, bubblingMouseEvents:false, keyboard:false}).on("click", pick).addTo(holeLayer);
  }
  if(H.tee && H.gC) L.polyline((H.line && H.line.length>1) ? H.line : [H.tee, H.gC], {color:"#fff", weight:2.5, opacity:.9, interactive:false}).addTo(holeLayer);
  if(H.tee) L.marker(H.tee, {icon:icon("teem"), interactive:false}).addTo(holeLayer);
  [H.gF, H.gB].forEach(p => p && L.circleMarker(p, {radius:4, color:"#fff", weight:2, fillColor:"#10201A", fillOpacity:1, interactive:false}).addTo(holeLayer));
  if(H.gC) L.marker(H.gC, {icon:icon("flag"), interactive:false}).addTo(holeLayer);
  renderMarkup();
  if(fit) fitHole();
  update();
  renderScoreBtn();
  S.lastHole = cur; save();
}

function fitHole(){
  const H = hole(cur), pts = [H.tee, H.gF, H.gC, H.gB].filter(Boolean);
  const pad = {paddingTopLeft:[30, 90], paddingBottomRight:[80, 150], maxZoom:19};
  if(pts.length >= 2) map.fitBounds(L.latLngBounds(pts), pad);
  else if(pts.length === 1) map.setView(pts[0], 18);
  else { const F = (S.course&&S.course.features)||[]; if(F.length) map.fitBounds(L.latLngBounds(F.flatMap(f=>f.pts)), pad); }
}

function update(){
  const H = hole(cur), m = me();
  const unitHtml = `<span class="unit">${u()}</span>`;
  $("#dF").innerHTML = (m && H.gF) ? fmt(dist(m,H.gF)) : "—";
  $("#dC").innerHTML = (m && H.gC) ? fmt(dist(m,H.gC)) + unitHtml : "—";
  $("#dB").innerHTML = (m && H.gB) ? fmt(dist(m,H.gB)) : "—";

  let src = "";
  if(!mapped(cur)) src = "This hole isn't mapped yet. Menu → Map the course to tap in tee and green.";
  else if(gps) src = "From your position";
  else src = "No GPS fix yet, measuring from the tee";
  const shot = lastShot();
  if(shot && gps) src += ` · Last shot ${fmt(dist(shot.ll, gps))}${u()}`;
  $("#src").textContent = src;

  renderHazards(H, m);
  renderMeasure();
  checkTeeNearby();
}

function renderHazards(H, m){
  const box = $("#haz"); box.innerHTML = "";
  if(!m || !H.gC || !S.course) return;
  const path = (H.line && H.line.length>1) ? H.line : (H.tee ? [H.tee, H.gC] : null); if(!path) return;
  const toXY = local(H.gC), pathXY = path.map(toXY), meXY = toXY(m), myToGreen = dist(m, H.gC);
  const out = [];
  (S.course.features||[]).forEach(f => {
    if(f.t!=="bunker" && f.t!=="water") return;
    const c = centroid(f.pts);
    if(lineDist(toXY(c), pathXY) > 45) return;            // belongs to this hole's corridor
    if(dist(c, H.gC) > myToGreen + 5) return;              // already behind you
    let near=Infinity, far=0; f.pts.forEach(p => { const d=dist(m,p); near=Math.min(near,d); far=Math.max(far,d); });
    const cx = toXY(c), v = [-meXY[0], -meXY[1]], w = [cx[0]-meXY[0], cx[1]-meXY[1]];
    const cross = v[0]*w[1]-v[1]*w[0], along = Math.hypot(v[0],v[1]) ? (v[0]*w[0]+v[1]*w[1])/Math.hypot(v[0],v[1]) : 0;
    const off = Math.abs(cross)/(Math.hypot(v[0],v[1])||1);
    const side = off < 8 ? "C" : (cross > 0 ? "L" : "R");
    if(along < -5) return;
    out.push({t:f.t, near, far, side});
  });
  out.sort((a,b)=>a.near-b.near).slice(0,5).forEach(h => {
    const el = document.createElement("div"); el.className = "hz";
    el.innerHTML = `<i style="background:${h.t==="water"?"var(--water)":"var(--sand)"}"></i>${h.t==="water"?"Water":"Bunker"} ${h.side} · <b>${fmt(h.near)}</b> / ${fmt(h.far)}`;
    el.title = "Distance to the front edge / to carry it";
    box.appendChild(el);
  });
}

function renderMeasure(){
  measLayer.clearLayers();
  if(!target){ if(targetMarker){ map.removeLayer(targetMarker); targetMarker=null; } return; }
  const H = hole(cur), m = me();
  if(!targetMarker){
    targetMarker = L.marker(target, {icon:icon("tgt"), draggable:true, keyboard:false, zIndexOffset:900}).addTo(map);
    targetMarker.on("drag", e => { const p=e.target.getLatLng(); target=[p.lat,p.lng]; renderMeasure(); });
    targetMarker.on("click", () => { target=null; renderMeasure(); });
  } else targetMarker.setLatLng(target);
  if(m){
    L.polyline([m, target], {color:"#fff", weight:3, opacity:.95, interactive:false}).addTo(measLayer);
    label(mid(m,target), fmt(dist(m,target))).addTo(measLayer);
  }
  if(H.gC){
    L.polyline([target, H.gC], {color:"#fff", weight:2, opacity:.85, dashArray:"6 6", interactive:false}).addTo(measLayer);
    label(mid(target,H.gC), fmt(dist(target,H.gC)), true).addTo(measLayer);
  }
}
const mid = (a,b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];

/* ---------- markup (notes and lines, kept per hole) ---------- */
function marks(){ return S.markup[cur] || (S.markup[cur] = []); }
function renderMarkup(){
  markLayer.clearLayers();
  (S.markup[cur]||[]).forEach((m, i) => {
    if(m.k==="note"){
      L.marker(m.ll, {icon:icon("notem", "✎")}).bindPopup(`${esc(m.text)}<br><button data-del="${i}">Delete note</button>`).addTo(markLayer);
    } else if(m.k==="line"){
      const len = pathLen(m.pts);
      L.polyline(m.pts, {color:"#FFD54A", weight:3.5, opacity:.95}).bindPopup(`Line · ${fmt(len)}${u()}<br><button data-del="${i}">Delete line</button>`).addTo(markLayer);
      label(m.pts[m.pts.length-1], fmt(len)+u(), true).addTo(markLayer);
    }
  });
  drawShots();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-del]"); if(!b) return;
  const i = +b.dataset.del; marks().splice(i,1); save(); map.closePopup(); renderMarkup();
});

/* ---------- map taps ---------- */
map.on("click", e => {
  const ll = [e.latlng.lat, e.latlng.lng];
  if(walk){ walkTap(ll); return; }
  if(editing){ assignSheet(ll); return; }
  if(mode==="measure"){ target = ll; renderMeasure(); }
  else if(mode==="note"){ noteSheet(ll); }
  else if(mode==="draw"){ drawPts.push(ll); renderDraw(); }
});

function setMode(m){
  mode = m; drawPts = []; drawLayer.clearLayers();
  document.querySelectorAll(".tool[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode===m));
  if(m==="draw") showBanner("Tap the map to draw a line. Each tap adds a point.", [["Undo",()=>{drawPts.pop();renderDraw();}],["Done",finishDraw,true]]);
  else if(m==="note") showBanner("Tap the map where you want the note.", [["Cancel",()=>setMode("measure")]]);
  else if(!editing) hideBanner();
}
function renderDraw(){
  drawLayer.clearLayers();
  if(!drawPts.length) return;
  L.polyline(drawPts, {color:"#FFD54A", weight:3.5, dashArray:"2 6"}).addTo(drawLayer);
  drawPts.forEach(p => L.circleMarker(p, {radius:4, color:"#FFD54A", fillOpacity:1, interactive:false}).addTo(drawLayer));
  if(drawPts.length>1) label(drawPts[drawPts.length-1], fmt(pathLen(drawPts))+u(), true).addTo(drawLayer);
}
function finishDraw(){
  if(drawPts.length > 1){ marks().push({k:"line", pts:drawPts.slice()}); save(); toast("Line saved to this hole"); }
  setMode("measure"); renderMarkup();
}
document.querySelectorAll(".tool[data-mode]").forEach(b => b.addEventListener("click", () => setMode(mode===b.dataset.mode && b.dataset.mode!=="measure" ? "measure" : b.dataset.mode)));

/* ---------- banner ---------- */
function showBanner(msg, btns){
  $("#bannerMsg").textContent = msg;
  const box = $("#bannerBtns"); box.innerHTML = "";
  btns.forEach(([t, fn, primary]) => { const b=document.createElement("button"); b.textContent=t; if(primary) b.className="primary"; b.onclick=fn; box.appendChild(b); });
  $("#banner").hidden = false;
}
function hideBanner(){ $("#banner").hidden = true; }

/* ---------- sheets ---------- */
function openSheet(html, wire){
  const s = $("#sheet"); s.innerHTML = `<div class="grab"></div>` + html; s.hidden = false; $("#scrim").hidden = false; s.scrollTop = 0;
  if(wire) wire(s);
}
function closeSheet(){ $("#sheet").hidden = true; $("#scrim").hidden = true; }
$("#scrim").addEventListener("click", closeSheet);
const on = (root, sel, fn) => root.querySelectorAll(sel).forEach(el => el.addEventListener("click", fn));

function noteSheet(ll){
  openSheet(`<h2>Note on hole ${cur}</h2><input type="text" id="noteText" maxlength="120" placeholder="e.g. Aim at the left gum tree">
    <div class="btns"><button id="nCancel">Cancel</button><button class="primary" id="nSave">Save note</button></div>`, s => {
    const inp = s.querySelector("#noteText"); setTimeout(()=>inp.focus(), 50);
    s.querySelector("#nCancel").onclick = () => { closeSheet(); setMode("measure"); };
    const go = () => { const t = inp.value.trim(); if(t){ marks().push({k:"note", ll, text:t}); save(); renderMarkup(); } closeSheet(); setMode("measure"); };
    s.querySelector("#nSave").onclick = go; inp.addEventListener("keydown", e => { if(e.key==="Enter") go(); });
  });
}

/* ---------- scoring ---------- */
function ensureRound(){ if(!S.round) S.round = {id:Date.now(), date:new Date().toISOString(), scores:{}}; return S.round; }
function scoreOf(h, round){ return ((round||S.round)||{scores:{}}).scores[h]; }
function gir(h, s){ return s && (s.s - s.p) <= hole(h).par - 2; }
function totals(round){
  let strokes=0, vs=0, thru=0, putts=0;
  Object.entries((round||{scores:{}}).scores).forEach(([h,s]) => { strokes+=s.s; vs+=s.s-hole(+h).par; putts+=s.p; thru++; });
  return {strokes, vs, thru, putts};
}
const vsTxt = v => v===0 ? "E" : (v>0 ? "+"+v : String(v));
function renderScoreBtn(){
  const s = scoreOf(cur), t = totals(S.round);
  $("#scoreBtn").textContent = s ? `Hole ${cur}: ${s.s}  ·  ${t.strokes} (${vsTxt(t.vs)})` : (t.thru ? `Score · ${t.strokes} (${vsTxt(t.vs)}) thru ${t.thru}` : "Start scoring");
}

function scoreSheet(){
  const H = hole(cur), had = scoreOf(cur);
  const s = had ? Object.assign({}, had) : {s:H.par, p:2, fw:null};
  const draw = () => {
    const t = totals(S.round);
    openSheet(`<h2>Hole ${cur} · Par ${H.par}</h2>
      <div class="row"><b>Strokes</b><div class="stepper"><button data-a="s-">−</button><span class="n">${s.s}</span><button data-a="s+">+</button></div></div>
      <div class="row"><b>Putts</b><div class="stepper"><button data-a="p-">−</button><span class="n">${s.p}</span><button data-a="p+">+</button></div></div>
      ${H.par>3 ? `<div class="row"><b>Fairway</b><div class="seg">${["L","Hit","R"].map(k=>`<button data-fw="${k}" class="${s.fw===k?"on":""}">${k==="L"?"Left":k==="R"?"Right":"Hit"}</button>`).join("")}</div></div>` : ""}
      <div class="row"><b>Green in regulation</b><span class="pill ${gir(cur,s)?"good":""}">${gir(cur,s)?"Yes":"No"}</span></div>
      <p class="note">Round so far: ${t.thru ? `${t.strokes} strokes, ${vsTxt(t.vs)} thru ${t.thru}` : "no holes scored yet"}.</p>
      <div class="btns"><button data-a="prev">‹ Hole ${cur>1?cur-1:18}</button><button class="primary" data-a="next">Save · Hole ${cur<18?cur+1:1} ›</button></div>`, root => {
      on(root, "[data-a]", e => {
        const a = e.currentTarget.dataset.a;
        if(a==="s-") s.s=Math.max(1,s.s-1); if(a==="s+") s.s=Math.min(15,s.s+1);
        if(a==="p-") s.p=Math.max(0,s.p-1); if(a==="p+") s.p=Math.min(s.s,s.p+1);
        if(a==="prev"||a==="next"){ commit(); closeSheet(); go(a==="next"?1:-1); return; }
        if(s.p > s.s) s.p = s.s;
        commit(); draw();
      });
      on(root, "[data-fw]", e => { const k=e.currentTarget.dataset.fw; s.fw = s.fw===k?null:k; commit(); draw(); });
    });
  };
  const commit = () => { ensureRound().scores[cur] = Object.assign({}, s); save(); renderScoreBtn(); };
  draw();
}

function scoreClass(d){ return d<=-2?"s-eagle":d===-1?"s-birdie":d===1?"s-bogey":d>=2?"s-double":""; }
function cardSheet(){
  const r = S.round, t = totals(r);
  const half = (from) => {
    let parT=0, scT=0, any=false;
    const hs = Array.from({length:9}, (_,i)=>from+i);
    const head = hs.map(h=>`<th>${h}</th>`).join("");
    const pars = hs.map(h=>{ parT+=hole(h).par; return `<td>${hole(h).par}</td>`; }).join("");
    const scs = hs.map(h=>{ const s=scoreOf(h); if(s){scT+=s.s;any=true;}
      return `<td><button data-h="${h}" class="${s?scoreClass(s.s-hole(h).par):""} ${h===cur?"cur-h":""}">${s?s.s:"·"}</button></td>`; }).join("");
    return `<div class="sc-wrap"><table class="sc"><tr><th>Hole</th>${head}<th>${from===1?"Out":"In"}</th></tr>
      <tr class="par"><td>Par</td>${pars}<td class="tot">${parT}</td></tr>
      <tr><td>Score</td>${scs}<td class="tot">${any?scT:""}</td></tr></table></div>`;
  };
  openSheet(`<h2>${COURSE_NAME} · scorecard</h2>${half(1)}<div style="height:10px"></div>${half(10)}
    <p class="note">${t.thru?`Total ${t.strokes} (${vsTxt(t.vs)}) thru ${t.thru}, ${t.putts} putts.`:"No scores in this round yet."} Circles are under par, squares are over. Tap a hole to go to it.</p>
    <div class="btns"><button data-a="stats">Rounds & stats</button>${t.thru?`<button class="primary" data-a="end">Finish round</button>`:""}</div>`, root => {
    on(root, "[data-h]", e => { closeSheet(); cur = +e.currentTarget.dataset.h; target=null; render(true); });
    on(root, "[data-a]", e => { const a=e.currentTarget.dataset.a; if(a==="stats") statsSheet(); if(a==="end") endRoundSheet(); });
  });
}

function endRoundSheet(){
  const t = totals(S.round);
  openSheet(`<h2>Finish this round?</h2><p class="note">${t.strokes} strokes, ${vsTxt(t.vs)} thru ${t.thru}. It will be saved to your round history and a fresh card starts next time you score.</p>
    <div class="btns"><button data-a="no">Keep playing</button><button class="primary" data-a="yes">Finish and save</button></div>`, root => {
    on(root, "[data-a]", e => {
      if(e.currentTarget.dataset.a==="yes"){ S.rounds.unshift(S.round); S.round=null; save(); renderScoreBtn(); toast("Round saved"); }
      closeSheet();
    });
  });
}

function statsSheet(){
  const rs = S.rounds, full = rs.filter(r => totals(r).thru===18);
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  let fwHit=0, fwTot=0, girY=0, girT=0, putts=[];
  rs.forEach(r => Object.entries(r.scores).forEach(([h,s]) => {
    h=+h; putts.push(s.p); girT++; if(gir(h,s)) girY++;
    if(hole(h).par>3 && s.fw){ fwTot++; if(s.fw==="Hit") fwHit++; }
  }));
  const scores = full.map(r=>totals(r).strokes);
  const perHole = Array.from({length:18},(_,i)=>{ const h=i+1, xs=rs.map(r=>r.scores[h]).filter(Boolean).map(s=>s.s-hole(h).par); return {h, n:xs.length, v:avg(xs)}; })
    .filter(x=>x.n).sort((a,b)=>b.v-a.v);
  const one = n => n==null ? "—" : n.toFixed(1);
  openSheet(`<h2>Rounds & stats</h2>
    <div class="stats">
      <div class="stat"><b>${full.length?one(avg(scores)):"—"}</b><span>Avg 18-hole score</span></div>
      <div class="stat"><b>${full.length?Math.min(...scores):"—"}</b><span>Best round</span></div>
      <div class="stat"><b>${putts.length?one(avg(putts)*18):"—"}</b><span>Putts per 18</span></div>
      <div class="stat"><b>${fwTot?Math.round(100*fwHit/fwTot)+"%":"—"}</b><span>Fairways hit</span></div>
      <div class="stat"><b>${girT?Math.round(100*girY/girT)+"%":"—"}</b><span>Greens in reg</span></div>
      <div class="stat"><b>${rs.length}</b><span>Rounds saved</span></div>
    </div>
    ${perHole.length?`<h3>Your toughest holes</h3><div class="list">${perHole.slice(0,5).map(x=>`<button class="item" data-h="${x.h}">Hole ${x.h} <span>avg ${x.v>=0?"+":""}${x.v.toFixed(2)} over ${x.n} round${x.n>1?"s":""}</span></button>`).join("")}</div>`:""}
    <h3>History</h3>
    <div class="list">${rs.length ? rs.map((r,i)=>{ const t=totals(r); return `<button class="item" data-r="${i}">${new Date(r.date).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short",year:"numeric"})} <span>${t.strokes} (${vsTxt(t.vs)})${t.thru<18?` · ${t.thru} holes`:""}</span></button>`; }).join("") : `<p class="note">Finish a round from the scorecard and it shows up here.</p>`}</div>`, root => {
    on(root, "[data-h]", e => { closeSheet(); cur=+e.currentTarget.dataset.h; target=null; render(true); });
    on(root, "[data-r]", e => roundSheet(+e.currentTarget.dataset.r));
  });
}
function roundSheet(i){
  const r = S.rounds[i], t = totals(r);
  const row = (from) => Array.from({length:9},(_,k)=>from+k).map(h=>{ const s=r.scores[h]; return `<td><button class="${s?scoreClass(s.s-hole(h).par):""}">${s?s.s:"·"}</button></td>`; }).join("");
  openSheet(`<h2>${new Date(r.date).toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"})}</h2>
    <div class="sc-wrap"><table class="sc"><tr><th></th>${[1,2,3,4,5,6,7,8,9].map(h=>`<th>${h}</th>`).join("")}</tr><tr><td>Out</td>${row(1)}</tr>
    <tr><th></th>${[10,11,12,13,14,15,16,17,18].map(h=>`<th>${h}</th>`).join("")}</tr><tr><td>In</td>${row(10)}</tr></table></div>
    <p class="note">${t.strokes} strokes (${vsTxt(t.vs)}), ${t.putts} putts.</p>
    <div class="btns"><button data-a="back">Back</button><button class="danger" data-a="del">Delete round</button></div>`, root => {
    on(root, "[data-a]", e => {
      if(e.currentTarget.dataset.a==="del"){
        const b=e.currentTarget; if(b.dataset.sure){ S.rounds.splice(i,1); save(); statsSheet(); toast("Round deleted"); } else { b.dataset.sure="1"; b.textContent="Tap again to delete"; }
      } else statsSheet();
    });
  });
}

/* ---------- shot marking ---------- */
function lastShot(){ const sh = (S.round && S.round.shots) || []; for(let i=sh.length-1;i>=0;i--) if(sh[i].h===cur) return sh[i]; return null; }
$("#markBtn").addEventListener("click", () => {
  if(!gps){ toast("Needs a GPS fix. Stand where the ball is and try again."); return; }
  const r = ensureRound(); r.shots = r.shots || [];
  const prev = lastShot();
  r.shots.push({h:cur, ll:gps, t:Date.now()}); save();
  toast(prev ? `Shot measured: ${fmt(dist(prev.ll,gps))}${u()}. New mark set.` : "Ball marked. Walk to your next shot to see the distance.");
  renderMarkup(); update();
});
function drawShots(){
  // shown as small diamonds on the current hole
  ((S.round&&S.round.shots)||[]).filter(s=>s.h===cur).forEach(s => L.marker(s.ll,{icon:icon("markm"),interactive:false}).addTo(markLayer));
}

/* ---------- edit course ---------- */
function startEdit(){
  editing = true; setMode("measure"); target=null; renderMeasure();
  showBanner(`Editing hole ${cur}. Tap the map to place the tee or green.`, [["Details",detailsSheet],["Done",stopEdit,true]]);
}
function stopEdit(){ editing=false; hideBanner(); toast("Course edits saved"); }
function setPoint(key, ll){ const o = S.overrides[cur] || (S.overrides[cur] = {}); o[key] = ll; save(); render(false); }
function assignSheet(ll){
  openSheet(`<h2>What is this spot on hole ${cur}?</h2>
    <div class="btns"><button data-k="tee">Tee</button><button data-k="gF">Green front</button><button class="primary" data-k="gC">Green centre</button><button data-k="gB">Green back</button></div>
    ${gps?`<p class="note" style="margin-top:14px">Standing on the spot? Use your GPS position instead of the tap:</p><div class="btns"><button data-g="tee">Tee = me</button><button data-g="gC">Green centre = me</button></div>`:""}
    <div class="btns"><button data-a="cancel">Cancel</button></div>`, root => {
    on(root, "[data-k]", e => { setPoint(e.currentTarget.dataset.k, ll); closeSheet(); });
    on(root, "[data-g]", e => { setPoint(e.currentTarget.dataset.g, gps.slice()); closeSheet(); });
    on(root, "[data-a]", closeSheet);
  });
}
function detailsSheet(){
  const H = hole(cur);
  openSheet(`<h2>Hole ${cur} details</h2>
    <div class="trio"><label>Par<input type="number" id="dPar" min="3" max="6" value="${H.par}"></label>
    <label>Stroke index<input type="number" id="dSi" min="1" max="18" value="${H.si}"></label>
    <label>Length (m)<input type="number" id="dLen" min="50" max="700" value="${H.len}"></label></div>
    ${H.osmPar && H.osmPar!==H.par ? `<p class="note">OpenStreetMap lists this hole as a par ${H.osmPar}.</p>`:""}
    <div class="btns"><button class="danger" data-a="reset">Clear my edits for this hole</button><button class="primary" data-a="save">Save</button></div>`, root => {
    on(root, "[data-a]", e => {
      if(e.currentTarget.dataset.a==="reset"){ delete S.overrides[cur]; }
      else { const o = S.overrides[cur] || (S.overrides[cur]={}); const n = id => parseInt(root.querySelector(id).value,10);
        if(n("#dPar")) o.par=n("#dPar"); if(n("#dSi")) o.si=n("#dSi"); if(n("#dLen")) o.len=n("#dLen"); }
      save(); closeSheet(); render(false);
    });
  });
}

const MAP_POS = {1:[0.810,0.386],2:[0.936,0.338],3:[0.891,0.685],4:[0.839,0.821],5:[0.872,0.644],6:[0.827,0.665],7:[0.705,0.767],8:[0.863,0.477],9:[0.825,0.483],10:[0.701,0.575],11:[0.503,0.758],12:[0.155,0.872],13:[0.161,0.721],14:[0.074,0.721],15:[0.165,0.792],16:[0.327,0.721],17:[0.481,0.709],18:[0.659,0.614]};
function layoutSheet(){
  const p = MAP_POS[cur];
  if(!ACTIVE.layout) return;
  openSheet(`<h2>Course layout · hole ${cur}</h2>
    <div class="layout"><img src="${MAP_IMG}" alt="The Grange course layout">${p?`<span class="ring" style="left:${p[0]*100}%;top:${p[1]*100}%"></span>`:""}</div>

/* ---------- guided mapping: tee, then green centre, for holes 1 to 18 ---------- */
let walk = null; // {want:"tee"|"gC", history:[{h,key,prev}]}
function startWalk(){
  editing = false; setMode("measure"); target = null; renderMeasure();
  walk = {want:"tee", history:[]};
  cur = 1; render(true); walkPrompt();
}
function walkPrompt(){
  const p = ACTIVE.layout ? MAP_POS[cur] : null;
  const inset = !p ? "" : `<span class="inset"><img src="${MAP_IMG}" alt="">${p?`<i style="left:${p[0]*100}%;top:${p[1]*100}%"></i>`:""}</span>`;
  showBanner("", [["Undo",walkUndo],["Skip",walkSkip],["Finish",stopWalk,true]]);
  $("#bannerMsg").innerHTML = `${inset}<b>Hole ${cur} of 18</b><br>Tap the ${walk.want==="tee"?"<b>tee</b> (the tee you play from)":"<b>middle of the green</b>"}. Zoom in for accuracy.`;
}
function walkTap(ll){
  const o = S.overrides[cur] || (S.overrides[cur] = {});
  walk.history.push({h:cur, key:walk.want, prev:o[walk.want]});
  o[walk.want] = ll; save();
  if(walk.want==="tee"){ walk.want = "gC"; render(false); }
  else { walk.want = "tee"; if(cur===18){ render(false); stopWalk(); return; } cur++; render(true); }
  walkPrompt();
}
function walkUndo(){
  const last = walk.history.pop(); if(!last) return;
  const o = S.overrides[last.h] || (S.overrides[last.h] = {});
  if(last.prev) o[last.key] = last.prev; else delete o[last.key];
  save(); walk.want = last.key; const moved = cur !== last.h; cur = last.h; render(moved); walkPrompt();
}
function walkSkip(){ walk.want = "tee"; if(cur===18){ stopWalk(); return; } cur++; render(true); walkPrompt(); }
function stopWalk(){
  walk = null; hideBanner();
  const n = Array.from({length:18},(_,i)=>i+1).filter(mapped).length;
  toast(n===18 ? "All 18 holes mapped. Back up your data and send me the file." : `${n} of 18 holes mapped`);
  render(true);
}

  openSheet(`<h2>Choose course</h2>` + Object.values(COURSES).map(c => {
    const n = c.id===ACTIVE.id ? Array.from({length:18},(_,i)=>i+1).filter(mapped).length : mappedN(c);
    return `<button class="crs${c.id===ACTIVE.id?" on":""}" data-c="${c.id}"><span><b>${esc(c.name)}</b><small>${esc(c.place)}</small></span><span class="pill${n===18?" good":""}">${n===18?"all 18 mapped":n+" of 18 mapped"}</span></button>`;
  }).join("") + `<p class="note">Each course keeps its own scores, rounds, notes and edits.</p>`, root => {
    on(root, "[data-c]", e => { const id = e.currentTarget.dataset.c; if(id===ACTIVE.id) return closeSheet();
      save(); try{ localStorage.setItem("grange.course", id); }catch(err){} location.reload(); });
  });
}
$("#courseBtn").addEventListener("click", courseSheet);
$("#courseCode").textContent = ACTIVE.code; document.title = ACTIVE.name;

/* ---------- menu ---------- */
function menuSheet(){
  const n = Array.from({length:18},(_,i)=>i+1).filter(mapped).length;
  openSheet(`<h2>${COURSE_NAME}</h2>
    <div class="list">
      ${ACTIVE.layout?`<button class="item" data-a="layout">Course layout <span>club map</span></button>`:""}
      <button class="item" data-a="card">Scorecard <span>${totals(S.round).thru?`thru ${totals(S.round).thru}`:"no round yet"}</span></button>
      <button class="item" data-a="stats">Rounds & stats <span>${S.rounds.length} saved</span></button>
      <button class="item" data-a="walk">Map the course <span>guided, 2 taps a hole</span></button>
      <button class="item" data-a="edit">Edit course <span>${n} of 18 holes mapped</span></button>
      <button class="item" data-a="osm">Reload course map <span>${S.course&&S.course.fetchedAt?new Date(S.course.fetchedAt).toLocaleDateString("en-AU"):"not loaded"}</span></button>
      <button class="item" data-a="clear">Clear notes and lines on hole ${cur} <span>${(S.markup[cur]||[]).length} items</span></button>
      <button class="item" data-a="export">Back up my data <span>.json file</span></button>
      <button class="item" data-a="import">Restore from backup <span>.json file</span></button>
    </div>
    <p class="note" style="margin-top:12px">Everything is stored on this phone only. Back up now and then, especially before clearing your browser data.</p>`, root => {
    on(root, "[data-a]", e => {
      const a = e.currentTarget.dataset.a;
      if(a==="card") return cardSheet();
      if(a==="layout") return layoutSheet();
      if(a==="stats") return statsSheet();
      closeSheet();
      if(a==="edit") startEdit();
      if(a==="walk") startWalk();
      if(a==="osm") importCourse(true);
      if(a==="units"){ S.units = S.units==="m"?"yd":"m"; try{ localStorage.setItem("grange.units", S.units); }catch(e){} save(); render(false); }
      if(a==="clear"){ S.markup[cur]=[]; save(); renderMarkup(); toast(`Hole ${cur} markup cleared`); }
      if(a==="export") exportData();
      if(a==="import") $("#importFile").click();
    });
  });
}
function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `golf-${ACTIVE.id}-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$("#importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { try{ const d = JSON.parse(rd.result); if(!d || typeof d!=="object" || !("overrides" in d)) throw 0;
      Object.keys(S).forEach(k=>delete S[k]); Object.assign(S, {course:null, overrides:{}, markup:{}, round:null, rounds:[], units:"m", lastHole:1}, d);
      save(); drawFeatures(); render(true); toast("Backup restored"); }catch(err){ toast("That file isn't a Golf Yardage backup"); } };
  rd.readAsText(f); e.target.value = "";
});

/* ---------- hole navigation ---------- */
function go(step){ cur = ((cur-1+step+18)%18)+1; target=null; render(true); if(editing) startEdit(); }
$("#prevH").addEventListener("click", ()=>go(-1));
$("#nextH").addEventListener("click", ()=>go(1));
$("#menuBtn").addEventListener("click", menuSheet);
$("#scoreBtn").addEventListener("click", scoreSheet);
$("#cardBtn").addEventListener("click", cardSheet);
$("#layoutBtn").addEventListener("click", layoutSheet);
if(!ACTIVE.layout) $("#layoutBtn").hidden = true;
$("#fitBtn").addEventListener("click", () => {
  const H = hole(cur);
  if(gps && H.gC) map.fitBounds(L.latLngBounds([gps, H.gC]), {paddingTopLeft:[30,90], paddingBottomRight:[80,150], maxZoom:19});
  else if(gps) map.setView(gps, 18); else fitHole();
});

// suggest switching holes when you're standing on a different tee
let suggested = null;
function checkTeeNearby(){
  const old = document.getElementById("teeChip"); if(old) old.remove();
  if(!gps || editing) return;
  for(let h=1; h<=18; h++){
    if(h===cur) continue; const t = hole(h).tee;
    if(t && dist(gps,t) < 22){
      const c = document.createElement("button"); c.id="teeChip"; c.className="chip action"; c.textContent=`On the ${h}${["th","st","nd","rd"][(h%10>3||Math.floor(h/10)===1)?0:h%10]} tee? Switch`;
      c.onclick = () => { cur=h; target=null; render(true); }; $("#chips").appendChild(c); return;
    }
  }
}

/* ---------- GPS ---------- */
function onFix(p){
  gps = [p.coords.latitude, p.coords.longitude]; gpsAcc = p.coords.accuracy; gpsTime = Date.now();
  if(!gpsDot){
    gpsCircle = L.circle(gps, {radius:gpsAcc, color:"#2B7BFF", weight:1, fillOpacity:.12, interactive:false}).addTo(gpsLayer);
    gpsDot = L.circleMarker(gps, {radius:8, color:"#fff", weight:3, fillColor:"#2B7BFF", fillOpacity:1, interactive:false}).addTo(gpsLayer);
  } else { gpsDot.setLatLng(gps); gpsCircle.setLatLng(gps).setRadius(gpsAcc); }
  const chip = $("#gpsChip"); chip.className = "chip " + (gpsAcc<=10?"ok":"meh");
  $("#gpsTxt").textContent = `GPS ±${Math.round(gpsAcc)}${"m"}`;
  update();
}
function onGpsErr(err){
  $("#gpsChip").className = "chip";
  $("#gpsTxt").textContent = err.code===1 ? "Location blocked. Allow it in browser settings" : "Searching for GPS…";
}
if("geolocation" in navigator) navigator.geolocation.watchPosition(onFix, onGpsErr, {enableHighAccuracy:true, maximumAge:2000, timeout:20000});
else $("#gpsTxt").textContent = "This browser has no GPS access";
setInterval(() => { if(gps && Date.now()-gpsTime > 30000){ $("#gpsChip").className="chip meh"; $("#gpsTxt").textContent="GPS signal stale"; } }, 10000);

/* keep the screen on while the app is open */
let lock = null;
async function wake(){ try{ if("wakeLock" in navigator && document.visibilityState==="visible" && !lock){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", ()=>{ lock=null; }); } }catch(e){} }
document.addEventListener("visibilitychange", wake);
document.addEventListener("click", wake, {once:true});

/* ---------- toast ---------- */
let tt;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, 3200); }

/* ---------- boot ---------- */
drawFeatures();
render(true);
if(!S.course || Date.now() - (S.course.fetchedAt||0) > 30*86400000) importCourse(false);
})();
</script>
</body>
</html>
